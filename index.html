<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Card - Mohammad Al-Sayed Mohammad Fayez</title>
    <style>
        /* --- CSS VARIABLES --- */
        /* These variables allow you to easily change the size, spacing, and colors of the entire card in one place. */
        :root {
            /* Physical Card Dimensions (Standard Bank Card) */
            --card-width: 85.6mm;
            --card-height: 54mm;
            --card-radius: 3.18mm;
            
            /* Colors */
            --color-metallic-dark: #101011;
            --color-metallic-mid: #2a2a2d;
            --color-metallic-light: #404045;
            --color-gold: #d4af37;
            --color-white: #ffffff;
            --color-grey: #b3b3b3;
            --color-grey-dark: #555555;
            --color-focus: #d4af37;
            
            /* Typography */
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* Spacing (Using mm to scale perfectly with the physical card size) */
            --spacing-xs: 1mm;
            --spacing-sm: 2.5mm;
            --spacing-md: 4mm;
            --spacing-lg: 6mm;
        }

        /* --- BASE & RESET --- */
        /* Basic reset to ensure consistent rendering across browsers */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: #f4f4f9;
            color: var(--color-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- LAYOUT & SCALING --- */
        /* The card-scaler acts as a responsive wrapper. 
           It scales the card up for screen viewing while preserving the exact 85.6x54mm dimensions internally. */
        .card-scaler {
            transform: scale(1);
            transform-style: preserve-3d;
            perspective: 1500px;
            transition: transform 0.3s ease;
            margin-bottom: 30px;
        }

        @media (min-width: 480px) {
            .card-scaler { transform: scale(1.2); }
        }

        @media (min-width: 768px) {
            .card-scaler { transform: scale(1.6); }
        }

        @media (min-width: 1024px) {
            .card-scaler { transform: scale(2); }
        }

        /* --- CARD OBJECT STYLES --- */
        .card {
            position: relative;
            width: var(--card-width);
            height: var(--card-height);
            border-radius: var(--card-radius);
            /* Metallic black gradient */
            background: linear-gradient(135deg, var(--color-metallic-light) 0%, var(--color-metallic-mid) 25%, var(--color-metallic-dark) 80%);
            /* Soft shadow underneath and a thin lighter edge to simulate thickness/light catching */
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.4),
                inset 0 0.5px 1px rgba(255, 255, 255, 0.4),
                inset 0 -0.5px 1px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        /* Sheen overlay that reacts to mouse movement */
        .card-sheen {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            z-index: 10;
            mix-blend-mode: soft-light;
            background: transparent;
            transition: background 0.1s ease-out;
        }

        /* Container for the internal layout */
        .card-content {
            display: flex;
            height: 100%;
            padding: var(--spacing-md) var(--spacing-lg);
            position: relative;
            z-index: 20;
            gap: var(--spacing-md);
        }

        /* --- COLUMNS --- */
        .col-left {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .col-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2.5mm; /* Spacing between contact items */
        }

        /* --- AVATAR --- */
        /* Initials fallback container */
        .avatar-container {
            width: 14mm;
            height: 14mm;
            border-radius: 3.5mm; /* Rounded square */
            background-color: var(--color-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .avatar-initials {
            font-size: 5mm;
            font-weight: 800;
            color: var(--color-metallic-dark);
            user-select: none;
        }

        .avatar-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Hidden by default, shown if image loads */
            display: none; 
        }

        /* --- LEFT COLUMN TEXT --- */
        .name {
            color: var(--color-gold);
            font-size: 3.2mm;
            line-height: 1.15;
            font-weight: 700;
            margin-top: 3.5mm;
            text-transform: uppercase;
            letter-spacing: 0.2mm;
        }

        .title {
            color: var(--color-white);
            font-size: 2.1mm;
            font-weight: 500;
            margin-top: 1.5mm;
            letter-spacing: 0.1mm;
        }

        .organization {
            color: var(--color-grey);
            font-size: 1.8mm;
            font-weight: 400;
            margin-top: 0.5mm;
        }

        /* --- RIGHT COLUMN CONTACT INFO --- */
        .contact-item {
            display: flex;
            flex-direction: column;
        }

        .contact-label {
            color: var(--color-grey);
            font-size: 1.4mm;
            font-weight: 700;
            letter-spacing: 0.3mm;
            text-transform: uppercase;
        }

        .contact-value {
            color: var(--color-white);
            font-size: 2mm;
            text-decoration: none;
            margin-top: 0.5mm;
            position: relative;
            display: inline-block;
        }

        /* 44x44px Tap Target Enforcement for Mobile Accessibility */
        .tap-target::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 44px;
            min-height: 44px;
            z-index: 30;
        }

        /* --- SOCIAL ICONS --- */
        .social-icons {
            display: flex;
            gap: 2mm;
            margin-top: 1mm;
            align-items: center;
        }

        .icon-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .social-icon {
            width: 4.5mm;
            height: 4.5mm;
            fill: var(--color-white);
            transition: fill 0.2s ease;
        }

        .icon-wrapper.active .social-icon {
            fill: var(--color-gold);
        }

        .icon-wrapper.disabled .social-icon {
            fill: var(--color-grey-dark);
            opacity: 0.5;
        }

        /* --- ACCESSIBILITY FOCUS STATES --- */
        a:focus-visible, button:focus-visible {
            outline: 2px solid var(--color-focus);
            outline-offset: 3px;
            border-radius: 1mm;
        }

        /* --- PRINT BUTTON --- */
        .print-btn {
            background-color: var(--color-metallic-dark);
            color: var(--color-gold);
            border: 1px solid var(--color-gold);
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .print-btn:hover {
            background-color: var(--color-metallic-mid);
            transform: translateY(-1px);
        }

        .print-btn:active {
            transform: translateY(1px);
        }

        /* --- PRINT STYLES --- */
        /* Ensures only the card is printed, at its exact physical size (85.6mm x 54mm) */
        @media print {
            body {
                background: none;
                padding: 0;
                margin: 0;
                display: block;
            }

            /* Hide everything that isn't the card */
            body > *:not(.card-scaler) {
                display: none !important;
            }

            .card-scaler {
                transform: none !important; /* Force exact 1:1 scale */
                perspective: none;
                margin: 0;
                position: absolute;
                top: 0;
                left: 0;
            }

            .card {
                transform: none !important;
                box-shadow: none !important; /* Remove shadows to save ink */
                border: 0.5px solid #ccc; /* Add a faint border for cutting guidance */
            }

            .card-sheen {
                display: none !important;
            }
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.getElementById('identity-card');
            const sheen = document.getElementById('sheen');
            
            // Respect the user's OS-level motion preferences for accessibility
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

            card.addEventListener('mousemove', (e) => {
                if (prefersReducedMotion.matches) return;

                // Calculate mouse position relative to the card's boundaries
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                // Tilt the card subtly (max 8 degrees) based on mouse position
                const rotateX = ((y - centerY) / centerY) * -8;
                const rotateY = ((x - centerX) / centerX) * 8;

                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

                // Move the lighting gradient smoothly across the surface
                const percentX = (x / rect.width) * 100;
                const percentY = (y / rect.height) * 100;

                sheen.style.background = `radial-gradient(circle at ${percentX}% ${percentY}%, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 50%)`;
            });

            // Settle gracefully back into the default state when the mouse leaves
            card.addEventListener('mouseleave', () => {
                if (prefersReducedMotion.matches) return;
                card.style.transform = `rotateX(0deg) rotateY(0deg)`;
                sheen.style.background = `transparent`;
            });
        });
    </script>
